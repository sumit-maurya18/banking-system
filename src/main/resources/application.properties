spring.application.name=banking-system
spring.devtools.restart.enabled=false
spring.jpa.open-in-view=false

# postgreSQL Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking_system}
spring.datasource.username=${DB_USERNAME:banking_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Keep 'always' when creating schema for first time and then switch to 'never'
#spring.sql.init.mode=always
spring.sql.init.mode=never